[project]
name = "lerobot-dataset-lint"
version = "0.2.0"
description = "Contract linter for LeRobot datasets: catch convention drift, dropped frames, stale stats and dead recordings before they poison a training run."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Lang Li" }]
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lerobot-lint = "lerobot_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_lint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
